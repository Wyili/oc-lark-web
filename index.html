<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>oc-lark 控制台</title><style>body{font:15px system-ui;margin:2rem;max-width:1100px}button,input,textarea{padding:.55rem;margin:.25rem}section{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:1rem 0}li{cursor:pointer;margin:.4rem}pre{white-space:pre-wrap;background:#f6f6f6;padding:1rem}</style><h1>oc-lark 控制台</h1><p>本地默认相对路径；GitHub Pages 请填写 API 地址和 Bearer Token。</p><label>API_BASE_URL <input id="api" placeholder="留空=当前站点"></label><label>Token <input id="token" type="password" autocomplete="off"></label><button id="refresh">刷新状态</button><section><h2>总览</h2><pre id="status">加载中…</pre></section><section><h2>私聊 / 群聊会话</h2><ul id="sessions"></ul><pre id="messages">选择会话查看消息</pre></section><section><h2>发送通知</h2><input id="chat" placeholder="会话 chat_id（可选）"><textarea id="text" placeholder="通知内容"></textarea><button id="send">发送</button><pre id="result"></pre></section><script>const $=id=>document.getElementById(id);const base=()=>$("api").value.replace(/\/$/,"");const headers=()=>$("token").value?{Authorization:"Bearer "+$("token").value}:{};async function get(p){const r=await fetch(base()+p,{headers:headers()});return r.json()}async function load(){try{$("status").textContent=JSON.stringify(await get("/api/status"),null,2);const d=await get("/api/sessions");const list=$("sessions");list.replaceChildren();for(const s of d.items||[]){const li=document.createElement("li");li.textContent=(s.identity||"会话")+" · "+(s.preview||"暂无消息")+" · "+(s.message_count||0)+" 条";li.addEventListener("click",()=>messages(s.session_ref));list.append(li)}if(!list.childElementCount){const li=document.createElement("li");li.textContent="暂无会话";list.append(li)}}catch(e){$("status").textContent="连接失败："+e}}async function messages(id){$("messages").textContent=JSON.stringify(await get("/api/sessions/"+encodeURIComponent(id)+"/messages"),null,2)}async function notify(){const r=await fetch(base()+"/api/notify",{method:"POST",headers:{"Content-Type":"application/json",...headers()},body:JSON.stringify({text:$("text").value,chat_id:$("chat").value})});$("result").textContent=JSON.stringify(await r.json(),null,2)}$("refresh").addEventListener("click",load);$("send").addEventListener("click",notify);load();setInterval(load,15000)</script></html>
